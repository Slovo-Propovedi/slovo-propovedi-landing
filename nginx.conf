# Слово.Проповеди landing page — static site + direct APK download.
# Serves files from /usr/share/nginx/html on port 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Compression for text-based assets only (never for APK binaries)
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        image/svg+xml;

    # ------------------------------------------------------------------
    # Security headers (strict CSP — no inline scripts/styles allowed)
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # ------------------------------------------------------------------
    # APK downloads — CRITICAL: stock nginx has NO .apk MIME mapping.
    # The scoped `types { }` block overrides mime.types so Android gets the
    # correct content type, otherwise downloads arrive as octet-stream.
    # ------------------------------------------------------------------
    location ~* ^/apk/.+\.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        charset off;
        gzip off;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Download metadata contract (produced server-side, mounted at /apk).
    # Served fresh on every request so the page always shows the latest.
    # ------------------------------------------------------------------
    location = /apk/latest.json {
        types { }
        default_type application/json;
        charset off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cache immutable static assets for a day
    location ~* \.(?:js|css|png|svg|ico|woff2)$ {
        expires 1d;
        access_log off;
    }

    # Never expose hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
    }

    # Fallback: serve index.html for anything else
    location / {
        charset utf-8;
        try_files $uri $uri/ /index.html;
    }
}
