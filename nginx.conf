# Слово.Проповеди landing page — static site + direct APK download.
# Serves files from /usr/share/nginx/html on port 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Compression for text-based assets only (never for APK binaries)
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        image/svg+xml;

    # ------------------------------------------------------------------
    # Security headers (strict CSP — no inline scripts/styles allowed).
    # NOTE: nginx does NOT inherit add_header from the server level into a
    # location that defines its own add_header. The locations below that set
    # Cache-Control/Content-Disposition therefore REPEAT this full set with
    # `always` so the security headers are present on every response.
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;

    # ------------------------------------------------------------------
    # Hidden files — deny FIRST. Regex locations are evaluated in file
    # order, so this must precede the /apk and asset regex locations:
    # otherwise /apk/.tmp-<pid>.apk (the refresh script's mid-copy partial)
    # and /assets/.secret.js would be served by the later-declared regexes.
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
    }

    # ------------------------------------------------------------------
    # APK downloads — CRITICAL: stock nginx has NO .apk MIME mapping.
    # The scoped `types { }` block overrides mime.types so Android gets the
    # correct content type, otherwise downloads arrive as octet-stream.
    # ------------------------------------------------------------------
    location ~* ^/apk/.+\.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        charset off;
        gzip off;
        # Security headers repeated (add_header inheritance fix)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Screenshots gallery images (synced from the mobile repo, mounted at
    # /screenshots). Filenames embed the git blob sha, so a changed image is a
    # new URL and old ones can be cached forever (immutable).
    # ------------------------------------------------------------------
    location ~* ^/screenshots/\w[\w.-]*\.(png|jpe?g|webp)$ {
        types {
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
        default_type image/png;
        charset off;
        gzip off;
        # Security headers repeated (add_header inheritance fix)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Screenshots gallery manifest (produced server-side, mounted at
    # /screenshots). Served fresh so the page always reflects the latest set.
    # ------------------------------------------------------------------
    location = /screenshots/manifest.json {
        types { }
        default_type application/json;
        charset off;
        # Security headers repeated (add_header inheritance fix)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Download metadata contract (produced server-side, mounted at /apk).
    # Served fresh on every request so the page always shows the latest.
    # ------------------------------------------------------------------
    location = /apk/latest.json {
        types { }
        default_type application/json;
        charset off;
        # Security headers repeated (add_header inheritance fix)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Index page — never cache so the freshly-written latest.json metadata is
    # picked up on the next visit. Security headers repeated (inheritance fix).
    # ------------------------------------------------------------------
    location = / {
        charset utf-8;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Cache immutable static assets for a day
    location ~* \.(?:js|css|png|svg|ico|woff2)$ {
        expires 1d;
        access_log off;
    }

    # Fallback: serve index.html for anything else
    location / {
        charset utf-8;
        try_files $uri $uri/ /index.html;
    }
}
