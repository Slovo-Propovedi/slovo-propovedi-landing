name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Tags point at commits already checked when they were pushed to main;
    # some Forgejo versions still dispatch this workflow for tag pushes
    # despite the branches filter, so guard explicitly.
    if: github.ref_type != 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Validate landing page
        run: npm run validate

      - name: Cleanup workspace
        if: always()
        run: rm -rf node_modules 2>/dev/null || true
