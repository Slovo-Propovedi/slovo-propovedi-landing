name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          # GITHUB_REF_NAME comes from the runner environment: a tag name is never
          # pasted into the script text, so a crafted ref cannot inject shell.
          TAG_VERSION="$GITHUB_REF_NAME"
          # Strip optional 'v' prefix
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            echo "::error::Run 'npm run bump-version <version>' to create a consistent release"
            exit 1
          fi
          echo "Version consistency check passed: $TAG_VERSION"

      - name: Wait for CI to pass on this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/commits/${{ github.sha }}/status"

          # Runner capacity is 2, so this job holding a runner slot while
          # polling no longer starves the CI workflow of a runner to run on.
          for i in $(seq 1 40); do
            # Forgejo appends the triggering event to the context, e.g.
            # "CI / validate (push)", so match by prefix rather than equality.
            STATE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$URL" | jq -r '.statuses[] | select(.context | startswith("CI / validate")) | .status' | head -1)

            case "$STATE" in
              success) echo "CI passed for ${{ github.sha }}"; exit 0 ;;
              failure|error) echo "::error::CI did not pass for ${{ github.sha }} (status: $STATE). Refusing to deploy."; exit 1 ;;
            esac

            echo "Waiting for CI status on ${{ github.sha }} (attempt $i/40)..."
            sleep 15
          done

          echo "::error::Timed out waiting for CI status on ${{ github.sha }}"
          exit 1

      - name: Validate required vars
        # Fail fast BEFORE any deploy work: all hostnames must be configured as
        # Forgejo org/repo-level vars (Settings → Actions → Variables).
        run: |
          set -e
          missing=0
          for var_name in LANDING_HOSTNAME WEB_HOSTNAME DOCS_HOSTNAME WWW_HOSTNAME REPOSITORY_URL MIRROR_CODEBERG_URL MIRROR_GITHUB_LATEST_RELEASE_URL MIRROR_GITHUB_SCREENSHOTS_RAW_URL APK_SIGNER_SHA256; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name is not set — add it as an org/repo Actions variable"
              missing=1
            fi
          done
          # The URL vars land in /etc/default/slovo-landing (read by systemd
          # and the refresh scripts) — only plain https URLs with a URL-safe
          # charset are accepted, so no value can carry quotes, spaces or `$`.
          for var_name in REPOSITORY_URL MIRROR_CODEBERG_URL MIRROR_GITHUB_LATEST_RELEASE_URL MIRROR_GITHUB_SCREENSHOTS_RAW_URL; do
            if [ -n "${!var_name}" ] && ! printf '%s' "${!var_name}" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$'; then
              echo "::error::$var_name must be a plain https:// URL (got '${!var_name}')"
              missing=1
            fi
          done
          # Pinned APK signer certificate(s): 64-hex SHA-256, comma-separated
          # during a key rotation. Public value — a variable, not a secret.
          if [ -n "$APK_SIGNER_SHA256" ] && ! printf '%s' "$APK_SIGNER_SHA256" | grep -Eq '^[0-9A-Fa-f]{64}(,[0-9A-Fa-f]{64})*$'; then
            echo "::error::APK_SIGNER_SHA256 must be one or more comma-separated 64-hex SHA-256 digests (apksigner verify --print-certs)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required vars present: LANDING_HOSTNAME=$LANDING_HOSTNAME WWW_HOSTNAME=$WWW_HOSTNAME WEB_HOSTNAME=$WEB_HOSTNAME DOCS_HOSTNAME=$DOCS_HOSTNAME REPOSITORY_URL=$REPOSITORY_URL MIRROR_CODEBERG_URL=$MIRROR_CODEBERG_URL MIRROR_GITHUB_LATEST_RELEASE_URL=$MIRROR_GITHUB_LATEST_RELEASE_URL MIRROR_GITHUB_SCREENSHOTS_RAW_URL=$MIRROR_GITHUB_SCREENSHOTS_RAW_URL"
        env:
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
          WWW_HOSTNAME: ${{ vars.WWW_HOSTNAME }}
          REPOSITORY_URL: ${{ vars.REPOSITORY_URL }}
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MIRROR_GITHUB_LATEST_RELEASE_URL: ${{ vars.MIRROR_GITHUB_LATEST_RELEASE_URL }}
          MIRROR_GITHUB_SCREENSHOTS_RAW_URL: ${{ vars.MIRROR_GITHUB_SCREENSHOTS_RAW_URL }}
          APK_SIGNER_SHA256: ${{ vars.APK_SIGNER_SHA256 }}

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          # The VPS host key is pinned from the org secret VPS_SSH_KNOWN_HOSTS
          # (`ssh-keyscan <VPS_HOST>` output, captured once and verified against
          # the server). A per-run ssh-keyscan on a fresh runner would trust
          # whatever key answers, i.e. offer no MITM protection.
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is not set — add the pinned VPS host key as a Forgejo org secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Applies to every ssh/scp call in this job: an unknown or changed
          # host key aborts instead of being accepted.
          printf 'StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          DEPLOY_TAG: ${{ github.ref_name }}
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WWW_HOSTNAME: ${{ vars.WWW_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
          REPOSITORY_URL: ${{ vars.REPOSITORY_URL }}
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MIRROR_GITHUB_LATEST_RELEASE_URL: ${{ vars.MIRROR_GITHUB_LATEST_RELEASE_URL }}
          MIRROR_GITHUB_SCREENSHOTS_RAW_URL: ${{ vars.MIRROR_GITHUB_SCREENSHOTS_RAW_URL }}
          APK_SIGNER_SHA256: ${{ vars.APK_SIGNER_SHA256 }}
        run: |
          SSH_TARGET="$VPS_SSH_USER@$VPS_HOST"
          # Write /etc/default/slovo-landing: the env file the timer-driven
          # refresh scripts (vps-refresh-apk / vps-refresh-screenshots) source
          # on each run. Idempotent — rewritten on every deploy so the vars
          # never drift from Forgejo org settings. Values were shape-checked in
          # "Validate required vars"; systemd reads the file as data
          # (EnvironmentFile=), the scripts parse it without sourcing.
          ssh "$SSH_TARGET" "sudo tee /etc/default/slovo-landing > /dev/null" <<EOF
          REPOSITORY_URL=$REPOSITORY_URL
          MIRROR_CODEBERG_URL=$MIRROR_CODEBERG_URL
          MIRROR_GITHUB_LATEST_RELEASE_URL=$MIRROR_GITHUB_LATEST_RELEASE_URL
          MIRROR_GITHUB_SCREENSHOTS_RAW_URL=$MIRROR_GITHUB_SCREENSHOTS_RAW_URL
          APK_SIGNER_SHA256=$APK_SIGNER_SHA256
          EOF
          # Transfer source code (runner already has the tagged checkout).
          # Path must match the deploy script's SRC_PATH.
          tar czf - --exclude='.git' --exclude=node_modules --exclude=test-apk . \
            | ssh "$SSH_TARGET" "rm -rf /slovo/landing/container-src && mkdir -p /slovo/landing/container-src && tar xzf - -C /slovo/landing/container-src"
          # Upload and run deploy script
          scp scripts/vps-deploy.sh "$SSH_TARGET:/tmp/vps-deploy.sh"
          # Shared infra (Traefik, Docker, slovo user, buildx) is owned by the
          # slovo-propovedi playbook; the script only verifies it.
          # Every value is shell-quoted for the remote shell with printf %q, so
          # a quote in a tag or variable can never break out of its argument.
          REMOTE_ENV="$(printf 'DEPLOY_TAG=%q LANDING_HOSTNAME=%q WWW_HOSTNAME=%q WEB_HOSTNAME=%q DOCS_HOSTNAME=%q REPOSITORY_URL=%q' \
            "$DEPLOY_TAG" "$LANDING_HOSTNAME" "$WWW_HOSTNAME" "$WEB_HOSTNAME" "$DOCS_HOSTNAME" "$REPOSITORY_URL")"
          ssh "$SSH_TARGET" "chmod +x /tmp/vps-deploy.sh && $REMOTE_ENV bash /tmp/vps-deploy.sh"

      - name: Provision tokens and refresh APK
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          # Tokens come in through env, never pasted into the script text.
          REPOSITORY_API_TOKEN: ${{ secrets.REPOSITORY_API_TOKEN }}
          GITHUB_MIRROR_TOKEN: ${{ secrets.GITHUB_MIRROR_TOKEN }}
        run: |
          SSH_TARGET="$VPS_SSH_USER@$VPS_HOST"
          # Optional tokens piped via stdin (never in process args)
          if [ -n "$REPOSITORY_API_TOKEN" ]; then
            printf '%s' "$REPOSITORY_API_TOKEN" | ssh "$SSH_TARGET" "umask 077 && mkdir -p /slovo/landing/tokens && cat > /slovo/landing/tokens/forgejo"
          fi
          if [ -n "$GITHUB_MIRROR_TOKEN" ]; then
            printf '%s' "$GITHUB_MIRROR_TOKEN" | ssh "$SSH_TARGET" "umask 077 && mkdir -p /slovo/landing/tokens && cat > /slovo/landing/tokens/github"
          fi
          # Refresh is best-effort: deployment must not fail if the APK source
          # is down. Log output for diagnosis. The unit is Type=oneshot, so
          # `systemctl start` blocks until the refresh finishes; afterwards
          # `is-active` would report inactive, so journalctl is the signal.
          # NOTE: `|| true` is intentional — a failed refresh must not block deploy.
          ssh "$SSH_TARGET" "systemctl start slovo-landing-refresh.service; journalctl -u slovo-landing-refresh.service -n 30 --no-pager || true"

      - name: Extract changelog section
        run: |
          VERSION="$GITHUB_REF_NAME"
          VERSION="${VERSION#v}"
          awk -v target="## [$VERSION]" '
            index($0, target) == 1 { found = 1; next }
            found && $0 ~ /^## \[/ { exit }
            found && $0 ~ /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

          if [ ! -s release-body.md ]; then
            echo "::error::No changelog section found for v$VERSION in CHANGELOG.md"
            exit 1
          fi

          echo "Extracted changelog for v$VERSION ($(wc -l < release-body.md) lines)"

      - name: Create Forgejo Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg name "$GITHUB_REF_NAME" \
            --arg body "$(cat release-body.md)" \
            '{tag_name: $tag, name: $name, body: $body}' > release.json

          HTTP_CODE=$(curl -s -o release-response.json -w "%{http_code}" -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data @release.json)

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to create Forgejo Release (HTTP $HTTP_CODE)"
            cat release-response.json
            exit 1
          fi

          echo "Created Forgejo Release $GITHUB_REF_NAME (HTTP $HTTP_CODE)"

      - name: Cleanup
        if: always()
        run: rm -f release-body.md release.json release-response.json
