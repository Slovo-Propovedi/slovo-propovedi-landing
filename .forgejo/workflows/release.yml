name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          # GITHUB_REF_NAME comes from the runner environment: a tag name is never
          # pasted into the script text, so a crafted ref cannot inject shell.
          TAG_VERSION="$GITHUB_REF_NAME"
          # Strip optional 'v' prefix
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            echo "::error::Run 'npm run bump-version <version>' to create a consistent release"
            exit 1
          fi
          echo "Version consistency check passed: $TAG_VERSION"

      - name: Wait for CI to pass on this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/commits/${{ github.sha }}/status"

          # Runner capacity is 2, so this job holding a runner slot while
          # polling no longer starves the CI workflow of a runner to run on.
          for i in $(seq 1 40); do
            # Forgejo appends the triggering event to the context, e.g.
            # "CI / validate (push)", so match by prefix rather than equality.
            STATE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$URL" | jq -r '.statuses[] | select(.context | startswith("CI / validate")) | .status' | head -1)

            case "$STATE" in
              success) echo "CI passed for ${{ github.sha }}"; exit 0 ;;
              failure|error) echo "::error::CI did not pass for ${{ github.sha }} (status: $STATE). Refusing to deploy."; exit 1 ;;
            esac

            echo "Waiting for CI status on ${{ github.sha }} (attempt $i/40)..."
            sleep 15
          done

          echo "::error::Timed out waiting for CI status on ${{ github.sha }}"
          exit 1

      - name: Validate required vars
        # Fail fast BEFORE any deploy work: all hostnames must be configured as
        # Forgejo org/repo-level vars (Settings → Actions → Variables) and the
        # registry push token as an org secret (Settings → Actions → Secrets).
        run: |
          set -e
          missing=0
          for var_name in LANDING_HOSTNAME WEB_HOSTNAME DOCS_HOSTNAME WWW_HOSTNAME MIRROR_CODEBERG_URL MIRROR_GITHUB_URL MOBILE_REPOSITORY_NAME APK_SIGNER_SHA256 TRAEFIK_NETWORK TRAEFIK_SERVICE BUILDX_BUILDER PACKAGE_REGISTRY_TOKEN; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name is not set — add it as an org/repo Actions variable"
              missing=1
            fi
          done
          # Repository coordinates land in /etc/default/slovo-landing (read by
          # systemd and the refresh scripts) and are baked into the image —
          # mirror hosts arrive as one https URL each with the owner as its
          # path (different owner spellings per host are natural), the repo
          # name is a plain slug, so no value can carry quotes, spaces or `$`
          # (same contract as the Dockerfile and the refresh scripts).
          # REPOSITORY_URL/_OWNER are not in the variables loops above: the
          # deploy step maps github.server_url / github.repository_owner into
          # those names on every run.
          for var_name in MIRROR_CODEBERG_URL MIRROR_GITHUB_URL; do
            if [ -n "${!var_name}" ] && ! printf '%s' "${!var_name}" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?/[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              echo "::error::$var_name must be an https URL with the owner as its only path segment, e.g. https://codeberg.org/Slovo_Propovedi (no trailing slash, no deeper path)"
              missing=1
            fi
          done
          for var_name in MOBILE_REPOSITORY_NAME; do
            if [ -n "${!var_name}" ] && ! printf '%s' "${!var_name}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              echo "::error::$var_name must be a plain org/repo slug (got '${!var_name}')"
              missing=1
            fi
          done
          # Pinned APK signer certificate(s): 64-hex SHA-256, comma-separated
          # during a key rotation. Public value — a variable, not a secret.
          if [ -n "$APK_SIGNER_SHA256" ] && ! printf '%s' "$APK_SIGNER_SHA256" | grep -Eq '^[0-9A-Fa-f]{64}(,[0-9A-Fa-f]{64})*$'; then
            echo "::error::APK_SIGNER_SHA256 must be one or more comma-separated 64-hex SHA-256 digests (apksigner verify --print-certs)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required vars present: LANDING_HOSTNAME=$LANDING_HOSTNAME WWW_HOSTNAME=$WWW_HOSTNAME WEB_HOSTNAME=$WEB_HOSTNAME DOCS_HOSTNAME=$DOCS_HOSTNAME REPOSITORY_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY MIRROR_CODEBERG_URL=$MIRROR_CODEBERG_URL MIRROR_GITHUB_URL=$MIRROR_GITHUB_URL MOBILE_REPOSITORY_NAME=$MOBILE_REPOSITORY_NAME"
        env:
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
          WWW_HOSTNAME: ${{ vars.WWW_HOSTNAME }}
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
          APK_SIGNER_SHA256: ${{ vars.APK_SIGNER_SHA256 }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          TRAEFIK_SERVICE: ${{ vars.TRAEFIK_SERVICE }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          # Pushes to the Forgejo container registry (see the build step) —
          # validated here so a missing secret fails before any deploy work.
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          # The VPS host key is pinned from the org secret VPS_SSH_KNOWN_HOSTS
          # (`ssh-keyscan <VPS_HOST>` output, captured once and verified against
          # the server). A per-run ssh-keyscan on a fresh runner would trust
          # whatever key answers, i.e. offer no MITM protection.
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is not set — add the pinned VPS host key as a Forgejo org secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Applies to every ssh/scp call in this job: an unknown or changed
          # host key aborts instead of being accepted.
          printf 'StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Build and push image to the registry
        # The image is built by the persistent `slovo-constrained` builder ON
        # the VPS (DOCKER_HOST over the SSH connection set up above — CI job
        # containers have no docker socket) and pushed to the Forgejo container
        # registry. Every deploy step below is a session-level "env:" block
        # sourced from vars.* / github.*. Every hostname/repository build arg
        # is shape-validated above and re-validated by the Dockerfile
        # itself. The deploy step only pulls the published image, so no source
        # tree is shipped to the VPS. The builder keeps layer caches
        # between releases; --push uploads straight from the builder. Pulls
        # are anonymous (public org), only pushes need the token.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
          # Step env mirrors github.server_url / github.repository_owner into
          # the REPOSITORY_URL / REPOSITORY_OWNER names the build args and
          # the env file expect — set on every run, no org variable needed.
          REPOSITORY_URL: ${{ github.server_url }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          DEPLOY_TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          set -e
          # Docker CLI + buildx are not part of the runner image: install
          # pinned static builds into the job (no daemon — the CLI talks to the
          # VPS daemon over SSH via DOCKER_HOST).
          DOCKER_CLI_VERSION=27.5.1
          BUILDX_VERSION=0.20.1
          mkdir -p "$HOME/.docker-cli"
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar xz -C "$HOME/.docker-cli" --strip-components=1 docker/docker
          curl -fsSL -o "$HOME/.docker-cli/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          chmod +x "$HOME/.docker-cli/docker-buildx"
          export PATH="$HOME/.docker-cli:$PATH"

          REGISTRY_HOST="${REPOSITORY_URL#https://}"
          # Image names must be lowercase: owner/repo come from the runner's
          # GITHUB_REPOSITORY env lowercased whole (${var,,}), so no org is
          # hardcoded and the ref always matches this repo's Packages tab
          # auto-link (Forgejo matches owner/repo case-insensitively).
          REGISTRY_IMAGE="${REPOSITORY_URL#*://}/${GITHUB_REPOSITORY,,}"
          IMAGE_REF="$REGISTRY_IMAGE"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

          # Login writes only to this job's docker config; buildx forwards the
          # credentials to the remote builder for the push. Never printed.
          printf '%s' "$PACKAGE_REGISTRY_TOKEN" \
            | docker login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin

          export DOCKER_HOST="ssh://$VPS_SSH_USER@$VPS_HOST"
          # Builder records live in THIS client's local store (~/.docker/buildx),
          # not on the daemon: a fresh job has no record of the host's
          # pre-provisioned $BUILDX_BUILDER (playbook role `slovo-buildx`), so
          # `--builder` would fail with "no builder found" even though its
          # buildkit container runs on the VPS. Adopt the builder idempotently
          # while the job's local record is missing (buildx 0.20 semantics,
          # verified against the release source):
          #   - container already present on the daemon -> `create` just saves
          #     the local record and `--bootstrap` only probes the RUNNING
          #     container (start on a running container is a no-op, nothing is
          #     restarted) — its layer cache stays intact;
          #   - container absent (first release / host rebuilt) -> recreated
          #     with the EXACT `slovo-buildx` role parameters, so a CI-created
          #     builder matches the playbook one;
          #   - parallel jobs racing the same first create -> buildx treats a
          #     container-name conflict ("already in use") as adopt-and-wait,
          #     so the loser ends up on the winner's container.
          if ! docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1; then
            docker buildx create \
              --name "$BUILDX_BUILDER" \
              --driver docker-container \
              --driver-opt "memory=1g" \
              --driver-opt "cpu-quota=80000" \
              --bootstrap >/dev/null
          fi
          # Single-platform linux/amd64 — the 4 GB host has no room for
          # multi-arch builds: the builder builds the one amd64 image the
          # deploy pulls. The build args bake the validated variables into
          # the static site at image build.
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE_REF:$DEPLOY_TAG" \
            --tag "$IMAGE_REF:latest" \
            --build-arg WEB_HOSTNAME="$WEB_HOSTNAME" \
            --build-arg LANDING_HOSTNAME="$LANDING_HOSTNAME" \
            --build-arg DOCS_HOSTNAME="$DOCS_HOSTNAME" \
            --build-arg REPOSITORY_URL="$REPOSITORY_URL" \
            --build-arg REPOSITORY_OWNER="$REPOSITORY_OWNER" \
            --build-arg MIRROR_CODEBERG_URL="$MIRROR_CODEBERG_URL" \
            --build-arg MIRROR_GITHUB_URL="$MIRROR_GITHUB_URL" \
            --build-arg MOBILE_REPOSITORY_NAME="$MOBILE_REPOSITORY_NAME" \
            --build-arg OCI_IMAGE_SOURCE="${REPOSITORY_URL}/${GITHUB_REPOSITORY}" \
            .

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          DEPLOY_TAG: ${{ github.ref_name }}
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WWW_HOSTNAME: ${{ vars.WWW_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
          # Same runner-derived repository coordinates as the build step; the
          # names are kept for /etc/default/slovo-landing and vps-deploy.sh.
          REPOSITORY_URL: ${{ github.server_url }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
          APK_SIGNER_SHA256: ${{ vars.APK_SIGNER_SHA256 }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          TRAEFIK_SERVICE: ${{ vars.TRAEFIK_SERVICE }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
        run: |
          set -e
          SSH_TARGET="$VPS_SSH_USER@$VPS_HOST"
          # Write /etc/default/slovo-landing: the env file the timer-driven
          # refresh units read on each run (EnvironmentFile=). Idempotent — rewritten on every deploy so the vars
          # never drift from Forgejo org settings. Values were shape-checked in
          # "Validate required vars"; systemd reads the file as data
          # (EnvironmentFile=), the scripts parse it without sourcing.
          ssh "$SSH_TARGET" "sudo tee /etc/default/slovo-landing > /dev/null" <<EOF
          REPOSITORY_URL=$REPOSITORY_URL
          REPOSITORY_OWNER=$REPOSITORY_OWNER
          MIRROR_CODEBERG_URL=$MIRROR_CODEBERG_URL
          MIRROR_GITHUB_URL=$MIRROR_GITHUB_URL
          MOBILE_REPOSITORY_NAME=$MOBILE_REPOSITORY_NAME
          APK_SIGNER_SHA256=$APK_SIGNER_SHA256
          EOF
          # Upload deploy + refresh scripts. The image was built and pushed in
          # the previous step, so no source tree is shipped to the VPS; the
          # refresh scripts are /tmp-staged for the deploy script to install
          # into the persistent /slovo/landing.
          scp scripts/vps-deploy.sh "$SSH_TARGET:/tmp/vps-deploy.sh"
          scp scripts/vps-refresh-apk.sh "$SSH_TARGET:/tmp/vps-refresh-apk.sh"
          scp scripts/vps-refresh-screenshots.sh "$SSH_TARGET:/tmp/vps-refresh-screenshots.sh"
          # Shared infra (Traefik, Docker, slovo user, buildx) is owned by the
          # slovo-propovedi playbook; the script only verifies it. Every value
          # is shell-quoted for the remote shell with printf %q, so a quote in
          # a tag or variable can never break out of its argument.
          if [ -z "${IMAGE_REF:-}" ]; then
            echo "::error::IMAGE_REF is not set — the registry build step must export it"
            exit 1
          fi
          REMOTE_ENV="$(printf 'DEPLOY_TAG=%q IMAGE_REF=%q LANDING_HOSTNAME=%q WWW_HOSTNAME=%q WEB_HOSTNAME=%q DOCS_HOSTNAME=%q REPOSITORY_URL=%q REPOSITORY_OWNER=%q MIRROR_CODEBERG_URL=%q MIRROR_GITHUB_URL=%q MOBILE_REPOSITORY_NAME=%q TRAEFIK_NETWORK=%q TRAEFIK_SERVICE=%q BUILDX_BUILDER=%q' \
            "$DEPLOY_TAG" "$IMAGE_REF" "$LANDING_HOSTNAME" "$WWW_HOSTNAME" "$WEB_HOSTNAME" "$DOCS_HOSTNAME" \
            "$REPOSITORY_URL" "$REPOSITORY_OWNER" "$MIRROR_CODEBERG_URL" "$MIRROR_GITHUB_URL" "$MOBILE_REPOSITORY_NAME" \
            "$TRAEFIK_NETWORK" "$TRAEFIK_SERVICE" "$BUILDX_BUILDER")"
          ssh "$SSH_TARGET" "chmod +x /tmp/vps-deploy.sh && $REMOTE_ENV bash /tmp/vps-deploy.sh"

      - name: Refresh APK
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          SSH_TARGET="$VPS_SSH_USER@$VPS_HOST"
          # The mobile repositories are public: the refresh reads releases
          # anonymously, no API tokens are provisioned.
          # Refresh is best-effort: deployment must not fail if the APK source
          # is down. Log output for diagnosis. The unit is Type=oneshot, so
          # `systemctl start` blocks until the refresh finishes; afterwards
          # `is-active` would report inactive, so journalctl is the signal.
          # NOTE: `|| true` is intentional — a failed refresh must not block deploy.
          ssh "$SSH_TARGET" "systemctl start slovo-landing-refresh.service; journalctl -u slovo-landing-refresh.service -n 30 --no-pager || true"

      - name: Extract changelog section
        run: |
          VERSION="$GITHUB_REF_NAME"
          VERSION="${VERSION#v}"
          awk -v target="## [$VERSION]" '
            index($0, target) == 1 { found = 1; next }
            found && $0 ~ /^## \[/ { exit }
            found && $0 ~ /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

          if [ ! -s release-body.md ]; then
            echo "::error::No changelog section found for v$VERSION in CHANGELOG.md"
            exit 1
          fi

          echo "Extracted changelog for v$VERSION ($(wc -l < release-body.md) lines)"

      - name: Create Forgejo Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg name "$GITHUB_REF_NAME" \
            --arg body "$(cat release-body.md)" \
            '{tag_name: $tag, name: $name, body: $body}' > release.json

          HTTP_CODE=$(curl -s -o release-response.json -w "%{http_code}" -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data @release.json)

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to create Forgejo Release (HTTP $HTTP_CODE)"
            cat release-response.json
            exit 1
          fi

          echo "Created Forgejo Release $GITHUB_REF_NAME (HTTP $HTTP_CODE)"

      - name: Cleanup
        if: always()
        run: rm -f release-body.md release.json release-response.json
